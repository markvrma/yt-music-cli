[package]
name = "msm"
version = "0.1.0"
edition = "2021"
description = "Terminal player for YouTube Music + local library, with cmusfm scrobbling and pixelated album art"
license = "MIT"
authors = ["Mark Verma"]

[dependencies]
crossterm = "0.29"
ureq = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1_smol = "1"
libc = "0.2"
